<style>
:root{--bg:#f4f5f7;--bg2:#eceef1;--card:#fff;--tx:#101214;--mu:#5b6470;--bd:#dfe3e8;--ac:#111418;--ac2:#3b4350;--bt:#fff;--sh:0 8px 30px rgba(16,18,20,.08);--nav:rgba(244,245,247,.85);--r:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1114;--bg2:#14171b;--card:#181b20;--tx:#f2f4f7;--mu:#9aa3ad;--bd:#2a2f36;--ac:#e8edf3;--ac2:#9aa3ad;--bt:#101214;--sh:0 10px 34px rgba(0,0,0,.45);--nav:rgba(15,17,20,.82)}}
:root[data-theme="dark"]{--bg:#0f1114;--bg2:#14171b;--card:#181b20;--tx:#f2f4f7;--mu:#9aa3ad;--bd:#2a2f36;--ac:#e8edf3;--ac2:#9aa3ad;--bt:#101214;--sh:0 10px 34px rgba(0,0,0,.45);--nav:rgba(15,17,20,.82)}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(100px + env(safe-area-inset-top,0px))}
body{font-synthesis:none;margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 Questrial,system-ui,sans-serif;transition:background .3s,color .3s;overflow-x:hidden}
h1,h2,h3,h4{font-family:Michroma,system-ui,sans-serif;line-height:1.15;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(1.45rem,3.1vw,2.3rem);font-weight:400;letter-spacing:-.02em;line-height:1.25}h2{font-size:clamp(1.2rem,2.3vw,1.6rem);font-weight:400;line-height:1.3}h3{font-size:.92rem;font-weight:400;line-height:1.35}h4{font-size:.82rem;font-weight:400;line-height:1.4}
p{margin:0 0 1em;color:var(--mu)}a{color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px;border-radius:6px}
.w{width:min(1160px,100% - 40px);margin-inline:auto}
section{padding:84px 0}.alt{background:var(--bg2)}
header{position:sticky;top:0;z-index:50;padding:12px 0 0;pointer-events:none}
.nb{position:relative;pointer-events:auto;display:flex;align-items:center;justify-content:space-between;height:72px;gap:14px;padding:0 12px 0 14px;background:var(--nav);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--bd);border-radius:20px;box-shadow:0 4px 20px rgba(20,25,70,.08);transition:box-shadow .3s,border-color .3s}
header.sc .nb{box-shadow:0 14px 40px rgba(20,25,70,.22);border-color:color-mix(in srgb,var(--ac) 35%,var(--bd))}
.logo{font:400 .8rem Michroma,sans-serif;text-decoration:none;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:5px;background:var(--bg2);border:1px solid var(--bd);border-radius:14px}
nav a{display:block;padding:8px 16px;border-radius:10px;text-decoration:none;color:var(--mu);font-weight:600;font-size:.9rem;transition:color .2s,background .2s}
nav a:hover{color:var(--tx);background:var(--card)}nav a.on{color:var(--bt);background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 35%,transparent)}
.rt{display:flex;gap:8px;align-items:center}.navcta{padding:10px 18px}
nav{position:absolute;top:calc(100% + 10px);right:0;width:min(320px,100%);background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:10px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .2s,transform .2s,visibility .2s;pointer-events:none}
nav.open{opacity:1;visibility:visible;transform:none;pointer-events:auto}
nav ul{flex-direction:column;background:none;border:0;padding:0}nav a{padding:12px 14px;font-size:.95rem}
nav li.mc{padding-top:8px}nav li.mc a{text-align:center;justify-content:center;width:100%}
.navcta{display:none}
.lg{width:44px;height:auto;flex:none;filter:drop-shadow(0 3px 10px rgba(200,208,220,.35))}
.lt{display:flex;flex-direction:column;line-height:1.1}.lt b{font:400 .85rem Michroma,sans-serif;letter-spacing:-.01em;white-space:nowrap}
@media(max-width:400px){.lt b{font-size:.72rem}.lt small{letter-spacing:.22em}.logo{gap:8px}.nb{gap:8px}}.lt small{font:400 .56rem Questrial,sans-serif;letter-spacing:.34em;color:var(--mu);margin-top:5px}
.em{display:flex;align-items:center;justify-content:center;gap:8px;width:42px;height:42px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);text-decoration:none;font-size:.85rem;white-space:nowrap;transition:border-color .2s}.em:hover{border-color:var(--ac)}.em span{display:none}
@media(min-width:900px){.em{width:auto;padding:0 14px}.em span{display:inline}}
.wm{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(72vw,560px);height:auto;opacity:.13;z-index:-1;pointer-events:none;user-select:none;filter:drop-shadow(0 0 30px rgba(222,176,66,.25))}
:root[data-theme="light"] .wm{opacity:.2}
.alt{background:color-mix(in srgb,var(--bg2) 55%,transparent)}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:8px}.chk li{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;color:var(--mu)}.chk .ic{width:16px;height:16px;margin-top:3px;color:var(--ac)}
:root{--w1a:#1A1D23;--w1b:#1A1D23;--w2a:#0E8FA6;--w2b:#0B6E85}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--w1a:#EAF0F6;--w1b:#B9C2CE;--w2a:#3CDCE6;--w2b:#1FA9C9}}
:root[data-theme="dark"]{--w1a:#EAF0F6;--w1b:#B9C2CE;--w2a:#3CDCE6;--w2b:#1FA9C9}
.lt b span{-webkit-background-clip:text;background-clip:text;color:transparent}.lt .e1{background-image:linear-gradient(90deg,var(--w1a),var(--w1b))}.lt .e2{background-image:linear-gradient(90deg,var(--w2a),var(--w2b))}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:.2s}
.ib:hover{border-color:var(--ac)}#mb{display:grid}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:12px;font:600 .95rem Questrial,sans-serif;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
.btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--bt);box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 30%,transparent)}.btn.p:hover{transform:translateY(-2px);box-shadow:0 12px 30px color-mix(in srgb,var(--ac) 40%,transparent)}
.btn.s{background:transparent;color:var(--tx);border-color:var(--bd)}.btn.s:hover{border-color:var(--ac);color:var(--ac)}
.btn.sm{padding:9px 16px;font-size:.88rem}
.hero{padding:70px 0 90px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-20% -10% auto auto;width:640px;height:640px;background:radial-gradient(circle,color-mix(in srgb,var(--ac2) 16%,transparent),transparent 65%);animation:drift 16s ease-in-out infinite alternate;pointer-events:none}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;position:relative}
.hero h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:1.15rem;max-width:56ch}.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.in>*{animation:up .8s both}.in>*:nth-child(2){animation-delay:.12s}.in>*:nth-child(3){animation-delay:.24s}
.viz{width:100%;height:auto;max-height:440px}.viz .l{stroke:var(--ac);stroke-opacity:.35;stroke-width:1.2}
.viz .n{fill:var(--card);stroke:var(--ac);stroke-width:2}.viz .e{fill:var(--ac2);animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.viz .f{animation:flow 3s linear infinite;stroke-dasharray:6 10;stroke:var(--ac2);stroke-opacity:.8}
.viz text{font:600 11px Questrial,sans-serif;fill:var(--mu)}
.grid{display:grid;gap:20px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:26px;box-shadow:var(--sh);transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-5px);border-color:var(--ac)}.card p{margin:0}
.ci{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:16px;color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.lm{display:inline-flex;margin-top:16px;color:var(--ac);font-weight:700;text-decoration:none;gap:6px;align-items:center}.lm:hover{gap:10px}.lm{transition:gap .2s}
.sh{max-width:680px;margin-bottom:44px}.sh.c{margin-inline:auto;text-align:center}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.flow{display:flex;gap:10px;flex-wrap:wrap;font:400 1.05rem Michroma,sans-serif;margin:20px 0}.flow b{color:var(--ac)}.flow em{font-style:normal;color:var(--mu)}
.mv{border-left:3px solid var(--ac);padding-left:20px;margin-bottom:22px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.tags li{padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);font-size:.85rem;font-weight:600;color:var(--mu)}
.svc{padding:64px 0;border-top:1px solid var(--bd)}.svc:first-of-type{border-top:0}
.svc .split{gap:48px}.stack{display:grid;gap:16px}
.mini{padding:20px}.mini h4{margin-bottom:6px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:34px;counter-reset:s}
.steps div{padding:0 18px 0 0;border-top:2px solid var(--bd);padding-top:18px;position:relative}
.steps div:before{content:"";position:absolute;top:-6px;left:0;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.steps b{font:400 .85rem Michroma,sans-serif;display:block;margin-bottom:4px}.steps p{font-size:.92rem}
.tl{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.tl:before{content:"";position:absolute;top:19px;left:5%;right:5%;height:2px;background:linear-gradient(90deg,var(--ac),var(--ac2));opacity:.5}
.tl div{position:relative;text-align:center}.tl i{width:40px;height:40px;border-radius:50%;background:var(--card);border:2px solid var(--ac);display:grid;place-items:center;margin:0 auto 14px;font:400 .8rem Michroma,sans-serif;font-style:normal;color:var(--ac)}
.tl p{font-size:.92rem}
.course{display:grid;grid-template-columns:.8fr 1.2fr;gap:36px;align-items:start}
.course .meta{margin-top:18px;display:grid;gap:8px;font-size:.92rem}
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;list-style:none;margin:0 0 20px;padding:0}
.mods li{display:flex;gap:10px;align-items:center;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);font-weight:600;font-size:.93rem}
.mods .ic{width:17px;height:17px;color:var(--ac)}
.band{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--bt);border-radius:24px;padding:48px;text-align:center}
.band h2,.band p{color:var(--bt);margin-inline:auto}.band .btn{background:var(--bt);color:var(--ac);margin-top:10px}
.cg{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:start}
form{display:grid;gap:16px}.fr{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:grid;gap:6px;font-weight:600;font-size:.9rem}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
textarea{min-height:130px;resize:vertical}.err{color:#e5484d;font-size:.82rem;font-weight:500;min-height:1.1em}input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:#e5484d}
.ok{padding:14px 16px;border-radius:12px;background:color-mix(in srgb,#22c55e 15%,transparent);border:1px solid #22c55e;display:none;font-weight:600}
footer{border-top:1px solid var(--bd);padding:60px 0 28px;background:var(--bg2)}
.fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}footer h4{margin-bottom:12px}footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer a{text-decoration:none;color:var(--mu)}footer a:hover{color:var(--ac)}
.soc{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.soc a,.soc span{width:40px;height:40px;border-radius:11px;border:1px solid var(--bd);display:grid;place-items:center;color:var(--mu);background:var(--card)}.soc span{opacity:.5;cursor:not-allowed}
.cp{margin-top:40px;padding-top:20px;border-top:1px solid var(--bd);font-size:.88rem;color:var(--mu)}
.pg{display:none}.pg.on{display:block}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}.rv.v{opacity:1;transform:none}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.7}}@keyframes flow{to{stroke-dashoffset:-32}}@keyframes drift{to{transform:translate(-60px,40px)}}
@media(max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.hg,.split,.course,.cg{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr 1fr;row-gap:28px}.tl{grid-template-columns:1fr;gap:20px}.tl:before{display:none}.tl div{text-align:left;display:grid;grid-template-columns:40px 1fr;gap:14px}.tl i{margin:0}.viz{max-height:320px}}
@media(max-width:760px){section{padding:60px 0}}
@media(max-width:560px){.g4,.g3,.g2,.fr,.mods,.fg,.steps{grid-template-columns:1fr}.band{padding:34px 22px}.btn{width:100%;justify-content:center}.row{flex-direction:column}.lm{width:auto}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>

function about(short){return sec("about-us",`<div class="split"><div class="rv"><h2>About ERROR POINT Technologies</h2>
<p>ERROR POINT Technologies is focused on bridging the gap between academic learning and real-world technology.</p>
<p>We help students gain practical skills through industry-oriented training, internships and project development while helping businesses turn ideas into reliable digital solutions.</p>
<p>Our approach is simple:</p><div class="flow"><b>Learn</b><em>→</em><b>Build</b><em>→</em><b>Apply</b><em>→</em><b>Grow</b></div>
${short?`<a class="lm" href="#/about">More about us ${ic("arrow")}</a>`:""}</div>
<div class="stack">${[["book","Learn","Practical training in modern technologies."],["code","Build","Real-world projects and hands-on experience."],["rocket","Grow","Career preparation and industry exposure."]].map(c=>`<div class="card rv mini" style="display:flex;gap:16px"><div class="ci" style="margin:0">${ic(c[0])}</div><div><h4>${c[1]}</h4><p>${c[2]}</p></div></div>`).join("")}</div></div>`,short?"alt":"")}

function pageAbout(){return `<section style="padding-bottom:0"><div class="w sh"><h1 style="font-size:clamp(1.35rem,2.8vw,2rem)">Where classroom learning meets real technology.</h1></div></section>`+about(false)+sec("",`<div class="grid g2"><div class="card rv"><div class="mv" style="margin:0"><h3>Mission</h3><p>To make technology education practical, accessible and industry-oriented.</p></div></div><div class="card rv"><div class="mv" style="margin:0;border-color:var(--ac2)"><h3>Vision</h3><p>To become a trusted technology and learning partner for students, institutions and businesses.</p></div></div></div>`,"alt")+why()+process()}

function svcBlock(s,i){
 const L=(a)=>a.map(x=>`<li>${ic("check")}${x}</li>`).join("");
 const c={
 internship:{t:"Industry-Oriented Internship Programs",b:`<p>Hands-on programs built around real tasks and a project you can show.</p><div class="stack">${[["Python Full Stack",["Python","HTML","CSS","JavaScript","Backend development","Database","APIs","Real-world project"]],["Data Analytics",["Excel","SQL","Python","Pandas","NumPy","Data Visualization","Power BI","Real-world analytics project"]],["Web Development",["HTML","CSS","JavaScript","Responsive design","Frontend development","Backend basics","Database integration","Project development"]]].map(p=>`<div class="card mini"><h4>${p[0]}</h4>${tags(p[1])}</div>`).join("")}</div>`,cta:["Apply for Internship"]},
 projects:{t:"Final Year Project Development & Guidance",b:`<p>ERROR POINT provides structured project support from idea selection to final presentation.</p><div class="grid g2">${[["IEEE Base Paper","Project ideas and development based on suitable IEEE research concepts."],["Complete Documentation","Provide structured project documentation and report guidance."],["Source Code","Well-organized project source code with technical explanation."],["Project Explanation Audio","Provide audio-based explanations to help students understand and present their project."]].map(f=>`<div class="card mini"><h4>${f[0]}</h4><p style="font-size:.92rem">${f[1]}</p></div>`).join("")}</div><div class="card mini" style="margin-top:16px"><h4>Project Guidance</h4>${tags(["Project architecture","Implementation","Testing","Presentation","Viva preparation"])}</div>`,cta:["Discuss Your Project"]},
 business:{t:"Business Technology Solutions",b:`<p>We help businesses transform ideas and requirements into practical digital solutions.</p><div class="grid g2">${[["globe","Website Development"],["code","Web Applications"],["app","Mobile Applications"],["brain","AI/ML Solutions"],["chart","Data Analytics"],["dash","Dashboard Development"],["cog","Custom Software Solutions"]].map(f=>`<div class="card mini" style="display:flex;gap:12px;align-items:center;padding:16px"><span style="color:var(--ac)">${ic(f[0])}</span><b style="font-size:.95rem">${f[1]}</b></div>`).join("")}</div>`,cta:["Start a Project"],extra:`<div class="steps rv">${[["Understand","Understand the client's requirement."],["Plan","Design the solution and technology approach."],["Build","Develop and test the solution."],["Deliver","Deploy and provide support."]].map((p,j)=>`<div><b>0${j+1} — ${p[0]}</b><p>${p[1]}</p></div>`).join("")}</div>`},
 placement:{t:"Placement Training",b:`<p>Prepare students with the technical, aptitude and communication skills required for today's recruitment process.</p><div class="stack">${[["Aptitude",["Quantitative Aptitude","Logical Reasoning","Problem Solving"]],["Technical Skills",["Python","SQL","Programming fundamentals","Data structures basics","Database fundamentals"]],["Communication",["Verbal Ability","Communication Skills","Group Discussion"]],["Interview Preparation",["Resume Building","Technical Interviews","HR Interviews","Mock Interviews","Interview Questions"]],["Coding Practice",["Problem-solving","Coding exercises","Interview-oriented programming"]]].map(p=>`<div class="card mini"><h4>${p[0]}</h4>${tags(p[1])}</div>`).join("")}</div>`,cta:["Join Placement Training"]}
 }[s.id];
 const head=`<div class="rv"><div class="ci">${ic(s.icon)}</div><h2>${c.t}</h2>${s.id==="internship"?"<p>Choose a track and build real skills through guided, practical work.</p>":""}${s.id==="internship"?`<div class="card mini" style="margin-top:20px"><h4>Internship Certificate &amp; Documents</h4><p style="margin-bottom:10px">Every successfully completed internship includes:</p><ul class="chk">${["Offer Letter","Internship Completion Certificate – E-Certificate &amp; Hard Copy","Letter of Recommendation (LOR)","Complete Notes"].map(x=>`<li>${ic("check")}${x}</li>`).join("")}</ul></div>`:""}<div class="row">${cta(c.cta[0],s.form)}</div></div>`;
 const body=`<div class="rv">${c.b}</div>`;
 return `<div class="svc" id="${s.id}"><div class="w"><div class="split" ${i%2?'style="direction:rtl"':""}><div style="direction:ltr">${head}</div><div style="direction:ltr">${body}</div></div>${c.extra||""}</div></div>`}
function pageServices(){return `<section style="padding-bottom:20px"><div class="w sh"><h1 style="font-size:clamp(1.35rem,2.8vw,2rem)">Services for students and businesses</h1><p class="lead">Internships, project support, custom solutions and placement training in one place.</p></div></section>`+SERVICES.map(svcBlock).join("")+band()}

function courseCard(c){const m=[["Duration",COURSE_META.duration],["Fee",COURSE_META.fee],["Certification",COURSE_META.certification]].filter(x=>x[1]);
 return `<article class="card course rv" id="${c.id}"><div><div class="ci">${ic(c.icon)}</div><h2 style="font-size:1.35rem">${c.name}</h2><p>${c.intro}</p>${m.length?`<div class="meta">${m.map(x=>`<div><b>${x[0]}:</b> ${x[1]}</div>`).join("")}</div>`:""}</div>
 <div><ul class="mods">${c.mods.map(x=>`<li>${ic("check")}${x}</li>`).join("")}</ul>${cta("View Course",c.form)}</div></article>`}
function pageCourses(){return `<section style="padding-bottom:20px"><div class="w sh"><h1 style="font-size:clamp(1.35rem,2.8vw,2rem)">Courses</h1><p class="lead">Practical, project-led courses designed to make you industry ready.</p></div></section>`+sec("",`<div class="stack">${COURSES.map(courseCard).join("")}</div>`)+band()}

const OPTS=["Internship","Final Year Project","Business Project","Placement Training","Python Full Stack Course","Data Analytics Course","Other"];
function pageContact(){const em=CONFIG.email,ph=CONFIG.phone,wa=CONFIG.whatsapp;
 const d=[CONFIG.location&&["pin",CONFIG.location],em&&["mail",`<a href="mailto:${em}">${em}</a>`],ph&&["users",`<a href="tel:${ph.replace(/\s/g,"")}">${ph}</a>`],wa&&["wa",`<a href="https://wa.me/${wa}" rel="noopener">Chat on WhatsApp</a>`]].filter(Boolean);
 return sec("",`<div class="cg"><div class="rv"><h1 style="font-size:clamp(1.35rem,2.8vw,2rem)">Let's Build Something Together.</h1>
<div class="card mini" style="margin-bottom:16px"><h3>For Students</h3><p>Interested in internships, courses, final-year projects or placement training?</p><a class="lm" href="#f">Get Started ${ic("arrow")}</a></div>
<div class="card mini"><h3>For Businesses</h3><p>Have a project or technology requirement?</p><a class="lm" href="#f" data-svc="Business Project">Discuss Your Project ${ic("arrow")}</a></div>
${d.length?`<div class="stack" style="margin-top:20px">${d.map(x=>`<div style="display:flex;gap:10px;align-items:center;color:var(--ac)">${ic(x[0])}<span>${x[1]}</span></div>`).join("")}</div>`:""}</div>
<form class="card rv" id="f" novalidate aria-label="Contact form">
<div class="fr"><label>Name<input name="name" autocomplete="name" required><span class="err"></span></label><label>Email<input name="email" type="email" autocomplete="email" required><span class="err"></span></label></div>
<div class="fr"><label>Phone<input name="phone" type="tel" autocomplete="tel" inputmode="tel" required><span class="err"></span></label><label>Select Service<select name="service" required><option value="">Select a service</option>${OPTS.map(o=>`<option>${o}</option>`).join("")}</select><span class="err"></span></label></div>
<label>Message<textarea name="message" required minlength="10"></textarea><span class="err"></span></label>
<button class="btn p" type="submit" style="justify-content:center">Submit${ic("arrow")}</button>
<div class="ok" id="ok" role="status"></div></form></div>`)}

function initForm(pre){const f=$("#f");if(!f)return;if(pre)f.service.value=OPTS.includes(pre)?pre:"";
 const R={name:v=>v.trim().length>=2||"Enter your full name.",email:v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)||"Enter a valid email like name@example.com.",phone:v=>/^[+()\-\s\d]{7,18}$/.test(v)&&v.replace(/\D/g,"").length>=7||"Enter a valid phone number (7–15 digits).",service:v=>!!v||"Choose a service.",message:v=>v.trim().length>=10||"Write at least 10 characters."};
 const chk=el=>{const r=R[el.name](el.value),e=el.parentNode.querySelector(".err");el.setAttribute("aria-invalid",r!==true);e.textContent=r===true?"":r;return r===true};
 [...f.elements].filter(e=>R[e.name]).forEach(e=>e.addEventListener("blur",()=>chk(e)));
 f.addEventListener("submit",ev=>{ev.preventDefault();const els=[...f.elements].filter(e=>R[e.name]);const ok=els.map(chk).every(Boolean);if(!ok){els.find(e=>e.getAttribute("aria-invalid")==="true").focus();return}
  const o=$("#ok");o.style.display="block";
  if(CONFIG.email){const b=`Name: ${f.name.value}\nEmail: ${f.email.value}\nPhone: ${f.phone.value}\nService: ${f.service.value}\n\n${f.message.value}`;o.textContent="Details checked. Your email app will open to send this enquiry.";location.href=`mailto:${CONFIG.email}?subject=${encodeURIComponent("Enquiry: "+f.service.value)}&body=${encodeURIComponent(b)}`}
  else o.textContent="Details checked. Online enquiries are not connected yet, so this message has not been sent.";f.reset()});
 document.querySelectorAll("[data-svc]").forEach(a=>a.addEventListener("click",()=>{f.service.value=a.dataset.svc}))}

const PAGES={home:pageHome,about:pageAbout,services:pageServices,courses:pageCourses,contact:pageContact};
function route(){const [,p="home",sub=""]=location.hash.split("/");const k=PAGES[p]?p:"home";const arg=decodeURIComponent(sub);
 $("#app").innerHTML=PAGES[k]();document.querySelectorAll("#links a").forEach(a=>a.classList.toggle("on",a.dataset.p===k));
 $("#nav").classList.remove("open");$("#mb").innerHTML=ic("menu");$("#mb").setAttribute("aria-expanded","false");
 document.title=k==="home"?"ERROR POINT Technologies | Learn, Build & Innovate":NAV.find(n=>n[0]===k)[1]+" | ERROR POINT Technologies";
 initForm(k==="contact"?arg:"");reveal();
 if(k==="contact"&&arg){setTimeout(()=>$("#f").scrollIntoView({block:"center"}),50)}
 else if(arg&&$("#"+arg)){setTimeout(()=>$("#"+arg).scrollIntoView(),50)}else scrollTo(0,0)}
function reveal(){const els=document.querySelectorAll(".rv");if(!("IntersectionObserver"in window)){els.forEach(e=>e.classList.add("v"));return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("v");io.unobserve(e.target)}}),{threshold:.12});els.forEach(e=>io.observe(e))}

/* chrome */
$("#links").innerHTML=NAV.map(n=>`<li><a href="#/${n[0]}" data-p="${n[0]}">${n[1]}</a></li>`).join("")+`<li class="mc"><a class="btn p sm" href="#/contact">Get Started</a></li>`;
$("#f1").innerHTML=NAV.map(n=>`<li><a href="#/${n[0]}">${n[1]}</a></li>`).join("");
$("#f2").innerHTML=SERVICES.map(s=>`<li><a href="#/services/${s.id}">${s.name}</a></li>`).join("");
$("#f3").innerHTML=COURSES.map(c=>`<li><a href="#/courses/${c.id}">${c.name}</a></li>`).join("");
const SO=[["LinkedIn","li",CONFIG.linkedin],["Instagram","ig",CONFIG.instagram],["GitHub","gh",CONFIG.github],["Email","mail",CONFIG.email&&"mailto:"+CONFIG.email],["WhatsApp","wa",CONFIG.whatsapp&&"https://wa.me/"+CONFIG.whatsapp]];
$("#soc").innerHTML=SO.map(s=>s[2]?`<a href="${s[2]}" aria-label="${s[0]}" rel="noopener" target="_blank">${ic(s[1])}</a>`:`<span role="img" aria-label="${s[0]} (not added yet)" title="${s[0]} – coming soon">${ic(s[1])}</span>`).join("");
{const e=$("#em");if(CONFIG.email){e.href="mailto:"+CONFIG.email;e.innerHTML=ic("mail")+`<span>${CONFIG.email}</span>`;e.setAttribute("aria-label","Email "+CONFIG.email)}else e.remove()}
if(CONFIG.location)$("#loc").innerHTML=ic("pin")+CONFIG.location;
$("#mb").innerHTML=ic("menu");
addEventListener("scroll",()=>document.querySelector("header").classList.toggle("sc",scrollY>10),{passive:true});
$("#mb").onclick=e=>{e.stopPropagation();const o=$("#nav").classList.toggle("open");$("#mb").innerHTML=ic(o?"x":"menu");$("#mb").setAttribute("aria-expanded",o);$("#mb").setAttribute("aria-label",o?"Close menu":"Open menu")};
document.addEventListener("click",e=>{if($("#nav").classList.contains("open")&&!e.target.closest("#nav,#mb"))$("#mb").click()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#nav").classList.contains("open"))$("#mb").click()});
function theme(t){document.documentElement.dataset.theme=t;const d=t==="dark";$("#tt").innerHTML=ic(d?"sun":"moon");$("#tt").setAttribute("aria-label",d?"Switch to light theme":"Switch to dark theme");try{localStorage.setItem("ep-theme",t)}catch(e){}}
let t0;try{t0=localStorage.getItem("ep-theme")}catch(e){}
theme(t0||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
$("#tt").onclick=()=>theme(document.documentElement.dataset.theme==="dark"?"light":"dark");
addEventListener("hashchange",()=>{if(location.hash==="#f"){history.replaceState(null,"","#/contact");route()}else route()});
if(!location.hash)location.hash="#/home";route();
</script>
</body>
</html>
