<style>
:root{--bg:#1b222c;--bg2:#161c24;--card:#232b37;--card2:#2a3341;--cream:#f3e6d0;--tx:#e9e4da;--mu:#8f9aa8;--bd:#2f3947;--or:#ff5a2c;--or2:#ff7a4d;--r:14px;color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.6 Montserrat,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 52%,rgba(255,255,255,.025) 52%,rgba(255,255,255,.025) 78%,transparent 78%),radial-gradient(900px 500px at 80% 10%,rgba(255,90,44,.07),transparent 60%)}
h1,h2,h3,h4{margin:0 0 .5em;color:var(--cream);line-height:1.15}
h1{font-size:clamp(2.2rem,6vw,4.4rem);font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
h1 em{font-style:normal;font-weight:300;display:block}
h2{font-size:clamp(1.5rem,3.4vw,2.3rem);font-weight:700;letter-spacing:-.01em}
h2 em{font-style:normal;font-weight:300}
h3{font-size:1.05rem;font-weight:600}h4{font-size:.9rem;font-weight:600}
p{margin:0 0 1em;color:var(--mu)}a{color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:3px;border-radius:6px}
.w{width:min(1180px,100% - 40px);margin-inline:auto}
section{padding:90px 0;position:relative}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:.72rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--or);margin-bottom:14px}
.eyebrow:before{content:"";width:34px;height:2px;background:var(--or)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:50;transition:background .3s,box-shadow .3s}
header.sc{background:rgba(22,28,36,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.nb{display:flex;align-items:center;justify-content:space-between;height:78px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.lg{width:42px;height:auto}
.lt{display:flex;flex-direction:column;line-height:1.1}
.lt b{font-weight:700;font-size:.9rem;letter-spacing:.06em;color:var(--cream);white-space:nowrap}
.lt b i{font-style:normal;color:var(--or)}
.lt small{font-size:.55rem;letter-spacing:.34em;color:var(--mu);margin-top:4px}
nav ul{display:flex;gap:30px;list-style:none;margin:0;padding:0}
nav a{text-decoration:none;font-size:.78rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);padding:6px 0;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
nav a:hover,nav a.on{color:var(--cream);border-color:var(--or)}
nav li.mc{display:none}
.rt{display:flex;align-items:center;gap:12px}
.ib{display:none;width:42px;height:42px;border:1px solid var(--bd);background:var(--card);color:var(--cream);border-radius:10px;place-items:center;cursor:pointer}
@media(max-width:900px){
 .ib{display:grid}.rt .btn{display:none}
 nav{position:absolute;top:78px;left:20px;right:20px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(-8px);transition:.2s}
 nav.open{opacity:1;visibility:visible;transform:none}
 nav ul{flex-direction:column;gap:0}nav a{display:block;padding:14px 10px;border:0;border-bottom:1px solid var(--bd)}
 nav li:last-child a{border:0}nav li.mc{display:block;padding-top:10px}nav li.mc a{text-align:center;border:0;color:#fff}
}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:6px;font:600 .74rem Montserrat,sans-serif;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s;color:#fff}
.btn.p{background:var(--or);box-shadow:0 10px 28px rgba(255,90,44,.28)}
.btn.p:hover{background:var(--or2);transform:translateY(-2px);box-shadow:0 14px 34px rgba(255,90,44,.4)}
.btn.s{background:transparent;color:var(--cream);border-color:#465366}
.btn.s:hover{border-color:var(--or);color:var(--or)}
.btn.sm{padding:11px 20px}
.btn .ic{width:16px;height:16px}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}

/* hero */
.hero{min-height:100svh;display:flex;align-items:center;padding:130px 0 90px;overflow:hidden}
.ghost{position:absolute;right:-4%;top:50%;transform:translateY(-50%);font-size:clamp(5rem,20vw,17rem);font-weight:800;line-height:.85;text-transform:uppercase;color:rgba(255,255,255,.035);text-align:right;pointer-events:none;user-select:none;z-index:0}
.hg{position:relative;z-index:1;display:grid;grid-template-columns:60px 1.2fr .8fr 40px;gap:30px;align-items:center}
.idx{display:grid;gap:14px;font-weight:600;font-size:.85rem;color:#3d4959}
.idx span.on{color:var(--cream);font-size:1.3rem;display:flex;align-items:center;gap:10px}
.idx span.on:before{content:"";width:22px;height:2px;background:var(--or)}
.hero .lead{max-width:44ch;font-size:1.02rem}
.soc-v{writing-mode:vertical-rl;display:flex;gap:18px;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mu);justify-self:end}
.soc-v a{text-decoration:none}.soc-v a:hover{color:var(--or)}

.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(520px circle at var(--mx,70%) var(--my,40%),rgba(255,90,44,.13),transparent 65%);pointer-events:none;z-index:0}
.hero h1{font-size:clamp(2.1rem,4.6vw,3.8rem)}
.hl{display:block;overflow:hidden;padding-bottom:.08em}
.hl>*{display:block;transform:translateY(112%);animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards}
.hl:nth-child(2)>*{animation-delay:.14s}.hl:nth-child(3)>*{animation-delay:.28s}
.or{color:var(--or)}
.hero .eyebrow,.hero .lead,.hero .row{animation:fup .9s .55s both}.hero .lead{animation-delay:.7s}.hero .row{animation-delay:.85s}
@keyframes rise{to{transform:none}}@keyframes fup{from{opacity:0;transform:translateY(16px)}}
@keyframes bob{50%{transform:translateY(-12px)}}@keyframes blink{50%{opacity:0}}
.stage{position:relative;justify-self:center;width:100%;max-width:440px;perspective:1200px;animation:fup 1s .6s both}
.win{background:linear-gradient(160deg,#283241,#1a212b);border:1px solid #3a4659;border-radius:16px;box-shadow:0 44px 90px rgba(0,0,0,.6),0 0 60px rgba(255,90,44,.08);transform-style:preserve-3d;will-change:transform;overflow:hidden}
.win-bar{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--bd);font-size:.68rem;color:var(--mu);letter-spacing:.12em}
.win-bar i{width:10px;height:10px;border-radius:50%;background:#3a4656}.win-bar i:first-child{background:var(--or)}.win-bar span{margin-left:auto}
.code{padding:18px 16px 12px;font:500 .78rem/1.95 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:196px;color:#c9d2de}
.ln{display:flex;align-items:center;gap:14px;white-space:pre;min-height:1.95em;border-radius:4px;margin:0 -8px;padding:0 8px;transition:background .4s}
.ln b{color:#46546a;font-weight:400;width:1ch;flex:none;text-align:right}
.ln .tx{flex:1;min-width:0}
.k{color:var(--or2)}.s{color:var(--cream)}.f{color:#7fb6ff}.c{color:#5f6d80}
.ln.bad{background:linear-gradient(90deg,rgba(255,77,77,.18),transparent)}
.ln.bad .t{text-decoration:underline wavy #ff5252;text-underline-offset:5px}
.ln.good{background:linear-gradient(90deg,rgba(74,222,128,.16),transparent)}
.tag{font:700 .56rem Montserrat,sans-serif;font-style:normal;letter-spacing:.16em;text-transform:uppercase;padding:4px 8px;border-radius:4px;background:#ff4d4d;color:#fff;animation:fup .4s both}
.ln.good .tag{background:#2fbf71}
.cur{display:inline-block;width:7px;height:1.05em;background:var(--or);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
.status{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--bd);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.status .pill{display:flex;align-items:center;gap:9px}
.status .dot{width:8px;height:8px;border-radius:50%;background:#8f9aa8;transition:background .3s,box-shadow .3s}
.status.bad .dot{background:#ff4d4d;box-shadow:0 0 12px #ff4d4d}.status.ok .dot{background:#4ade80;box-shadow:0 0 12px #4ade80}
.chip{position:absolute;z-index:3;will-change:transform}
.cb{display:block;padding:9px 16px;border-radius:99px;background:rgba(35,43,55,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #3b475a;font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);box-shadow:0 14px 30px rgba(0,0,0,.4);animation:bob 5s ease-in-out infinite}
.cb:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--or);margin-right:9px}

.pj{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.opt{border:1px solid var(--bd);border-radius:12px;padding:20px;background:var(--bg2)}
.opt .lab{font-size:.66rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--or)}
.opt h4{margin:8px 0 6px;font-size:1.05rem}.opt p{font-size:.86rem;margin:0}
.opt.hot{border-color:var(--or);background:linear-gradient(160deg,rgba(255,90,44,.1),var(--bg2))}
.note{font-size:.76rem;color:var(--mu);margin:14px 0 0}
.who h3{margin:0 0 8px}.who .ci{margin-bottom:18px}
.faq{max-width:820px}
.faq details{border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:12px;transition:border-color .2s}
.faq details[open]{border-color:var(--or)}
.faq summary{cursor:pointer;list-style:none;padding:20px 24px;font-weight:600;color:var(--cream);display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:.95rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";font-size:1.4rem;color:var(--or);transition:transform .25s;line-height:1}
.faq details[open] summary:after{transform:rotate(45deg)}
.faq details p{margin:0;padding:0 24px 22px;font-size:.9rem}
.sub{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);margin:22px 0 0}
.incl{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.incl .card{padding:22px}.incl .ic{width:24px;height:24px;color:var(--or);margin-bottom:12px}.incl h4{margin:0 0 4px;font-size:.92rem}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(280px circle at var(--cx,50%) var(--cy,50%),rgba(255,90,44,.15),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover:before{opacity:1}
@media(max-width:960px){.incl{grid-template-columns:1fr 1fr}.pj{grid-template-columns:1fr}.hg{grid-template-columns:1fr}.idx,.soc-v{display:none}.stage{max-width:420px;justify-self:center;margin-top:20px}.hero{min-height:auto}}

/* cards / grids */
.grid{display:grid;gap:20px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:28px;transition:transform .25s,border-color .25s,background .25s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-5px);border-color:var(--or)}
.card p{margin:0;font-size:.9rem}
.num{position:absolute;top:18px;right:22px;font-size:.8rem;font-weight:700;color:#3d4959}
.ci{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;margin-bottom:20px;color:var(--or);background:rgba(255,90,44,.12)}
.lm{display:inline-flex;margin-top:18px;color:var(--or);font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;gap:8px;align-items:center;transition:gap .2s}.lm:hover{gap:14px}.lm .ic{width:16px;height:16px}
.sh{margin-bottom:46px;max-width:640px}.sh.c{margin-inline:auto;text-align:center}.sh.c .eyebrow{justify-content:center}
.alt{background:rgba(0,0,0,.18)}
.flow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-weight:700;font-size:1.05rem;margin:22px 0 0;color:var(--cream);text-transform:uppercase;letter-spacing:.06em}.flow em{font-style:normal;color:var(--or)}

/* why */
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;background:var(--card)}
.why div{padding:28px 24px;border-right:1px solid var(--bd)}.why div:last-child{border:0}
.why .ic{width:26px;height:26px;color:var(--or);margin-bottom:14px}
.why h4{margin:0;font-size:.9rem}.why p{font-size:.82rem;margin:6px 0 0}

/* tags */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.tags li{padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--bg2);font-size:.78rem;font-weight:500;color:var(--tx);transition:border-color .2s,color .2s}
.tags li:hover{border-color:var(--or);color:var(--or)}
.chk{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}.chk li{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--tx)}.chk .ic{width:15px;height:15px;color:var(--or)}

/* services page */
.page-h{padding:150px 0 30px}
.svc{padding:64px 0;border-top:1px solid var(--bd)}
.svc .split{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
.svc .stack{display:grid;gap:16px}
.mini{padding:22px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:40px}
.steps div{border-top:2px solid var(--bd);padding-top:16px;position:relative}
.steps div:before{content:"";position:absolute;top:-6px;left:0;width:10px;height:10px;border-radius:50%;background:var(--or)}
.steps b{display:block;font-size:.82rem;margin-bottom:4px;color:var(--cream);letter-spacing:.08em;text-transform:uppercase}.steps p{font-size:.85rem;margin:0}
.chip-row{display:flex;gap:12px;align-items:center;padding:16px 18px}.chip-row .ic{color:var(--or)}.chip-row b{font-size:.88rem;font-weight:600;color:var(--cream)}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;position:relative}
.tl:before{content:"";position:absolute;top:20px;left:6%;right:6%;height:2px;background:linear-gradient(90deg,var(--or),transparent 140%);opacity:.5}
.tl div{text-align:center;position:relative}
.tl i{width:42px;height:42px;border-radius:50%;background:var(--bg);border:2px solid var(--or);display:grid;place-items:center;margin:0 auto 14px;font:700 .85rem Montserrat;font-style:normal;color:var(--or)}
.tl h4{margin:0;text-transform:uppercase;letter-spacing:.1em}

/* courses */
.course{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;align-items:start}
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;list-style:none;margin:0 0 24px;padding:0}
.mods li{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--bg2);font-weight:500;font-size:.85rem}
.mods .ic{width:15px;height:15px;color:var(--or)}

/* band */
.band{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--or);border-radius:var(--r);padding:48px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;position:relative;overflow:hidden}
.band:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:26px solid rgba(255,90,44,.12);border-radius:50%}
.band h2{margin:0;position:relative;z-index:1}.band .btn{position:relative;z-index:1}

/* contact */
.cg{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:start}
form{display:grid;gap:16px}.fr{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:grid;gap:6px;font-weight:500;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
input,select,textarea{font:400 .95rem Montserrat,sans-serif;letter-spacing:0;text-transform:none;color:var(--tx);background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:13px 14px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(255,90,44,.2)}
select option{background:var(--bg2)}
textarea{min-height:120px;resize:vertical}.err{color:#ff8a7a;font-size:.76rem;text-transform:none;letter-spacing:0;min-height:1.1em}
input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:#ff6b5a}
.ok{padding:14px 16px;border-radius:8px;background:rgba(34,197,94,.12);border:1px solid #22c55e;display:none;font-size:.9rem}
.contact-list{display:grid;gap:14px;margin-top:26px}
.contact-list div{display:flex;gap:12px;align-items:center;color:var(--tx)}.contact-list .ic{color:var(--or)}.contact-list a{text-decoration:none}.contact-list a:hover{color:var(--or)}


/* quick contact under Get Started */
.gs{display:flex;flex-direction:column;align-items:stretch;gap:7px}
.gs .btn{justify-content:center;padding:10px 20px}
.qc{display:flex;align-items:center;justify-content:center;gap:12px;font-size:.66rem;font-weight:500;line-height:1}
.qc a,nav .qc a{display:inline-flex;align-items:center;gap:6px;padding:0;border:0;text-decoration:none;text-transform:none;letter-spacing:0;font-size:.66rem;font-weight:500;color:var(--mu);transition:color .2s}
.qc a:hover,nav .qc a:hover{color:var(--or)}
.qc .ic{width:15px;height:15px}
.qc a.wa .ic,nav .qc a.wa .ic{color:#25d366}
nav li.mq{display:none}
@media(max-width:1100px){.qc .tx{display:none}}
@media(max-width:900px){.gs{display:none}
 nav li.mq{display:block;padding:14px 10px 4px}
 nav li.mq .qc{justify-content:center;gap:22px}
 nav li.mq .qc .tx{display:inline}
 nav li.mq .qc a{font-size:.8rem;color:var(--tx)}
 nav li.mq .qc .ic{width:18px;height:18px}}
/* footer */
footer{border-top:1px solid var(--bd);padding:44px 0 26px;background:var(--bg2)}
.fg{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:center}
footer ul{list-style:none;margin:0;padding:0;display:flex;gap:26px;flex-wrap:wrap}
footer ul a{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--mu)}footer ul a:hover{color:var(--or)}
.soc{display:flex;gap:10px}.soc a,.soc span{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;color:var(--mu);transition:.2s}.soc a:hover{border-color:var(--or);color:var(--or)}.soc span{opacity:.4;cursor:not-allowed}
.cp{margin-top:30px;padding-top:20px;border-top:1px solid var(--bd);font-size:.78rem;color:var(--mu);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.rv{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s}.rv.v{opacity:1;transform:none}
@media(max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.svc .split,.course,.cg{grid-template-columns:1fr;gap:32px}.why{grid-template-columns:1fr 1fr}.why div:nth-child(2){border-right:0}.why div:nth-child(-n+2){border-bottom:1px solid var(--bd)}.steps{grid-template-columns:1fr 1fr;row-gap:28px}.tl{grid-template-columns:1fr;gap:18px}.tl:before{display:none}.tl div{text-align:left;display:flex;gap:14px;align-items:center}.tl i{margin:0}}
@media(max-width:760px){section{padding:64px 0}.band{padding:32px 24px}}
@media(max-width:560px){.incl{grid-template-columns:1fr}.g4,.g3,.g2,.fr,.mods,.why,.steps,.chk{grid-template-columns:1fr}.why div{border-right:0!important;border-bottom:1px solid var(--bd)}.why div:last-child{border:0}.btn{width:100%;justify-content:center}.row{flex-direction:column}.lm{width:auto}.cp{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}.hl>*{transform:none}}
</style>

const OPTS=["Internship","Final Year Project","Journal Paper Publication","Business Project","Placement Training","Python Full Stack Course","Data Analytics Course","Other"];
function pageContact(){const em=CONFIG.email,ph=CONFIG.phone,wa=CONFIG.whatsapp;
 const d=[CONFIG.location&&["pin",CONFIG.location],em&&["mail",`<a href="mailto:${em}">${em}</a>`],ph&&["phone",`<a href="tel:${ph.replace(/\s/g,"")}">${ph}</a>`],wa&&["wa",`<a href="${waLink()}" rel="noopener" target="_blank">Chat on WhatsApp</a>`]].filter(Boolean);
 return `<section class="page-h" style="padding-bottom:0"><div class="w"><div class="eyebrow">Contact</div><h1 style="font-size:clamp(1.8rem,4.6vw,3.2rem)">Let's build <em>together.</em></h1></div></section>`+sec("",`<div class="cg"><div class="rv">

<form class="card rv" id="f" novalidate aria-label="Contact form">
<div class="fr"><label>Name<input name="name" autocomplete="name" required><span class="err"></span></label><label>Email<input name="email" type="email" autocomplete="email" required><span class="err"></span></label></div>
<div class="fr"><label>Phone<input name="phone" type="tel" autocomplete="tel" inputmode="tel" required><span class="err"></span></label><label>Service<select name="service" required><option value="">Select a service</option>${OPTS.map(o=>`<option>${o}</option>`).join("")}</select><span class="err"></span></label></div>

<button class="btn p" type="submit" style="justify-content:center">Submit${ic("arrow")}</button>

function initForm(pre){const f=$("#f");if(!f)return;if(pre)f.service.value=OPTS.includes(pre)?pre:"";
 const R={name:v=>v.trim().length>=2||"Enter your full name.",email:v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)||"Enter a valid email like name@example.com.",phone:v=>/^[+()\-\s\d]{7,18}$/.test(v)&&v.replace(/\D/g,"").length>=7||"Enter a valid phone number (7–15 digits).",service:v=>!!v||"Choose a service.",message:v=>v.trim().length>=10||"Write at least 10 characters."};
 const chk=el=>{const r=R[el.name](el.value),e=el.parentNode.querySelector(".err");el.setAttribute("aria-invalid",r!==true);e.textContent=r===true?"":r;return r===true};
 [...f.elements].filter(e=>R[e.name]).forEach(e=>e.addEventListener("blur",()=>chk(e)));
 f.addEventListener("submit",ev=>{ev.preventDefault();const els=[...f.elements].filter(e=>R[e.name]);const ok=els.map(chk).every(Boolean);if(!ok){els.find(e=>e.getAttribute("aria-invalid")==="true").focus();return}
  const o=$("#ok");o.style.display="block";
  if(CONFIG.email){const b=`Name: ${f.name.value}\nEmail: ${f.email.value}\nPhone: ${f.phone.value}\nService: ${f.service.value}\n\n${f.message.value}`;o.textContent="Details checked. Your email app will open to send this enquiry.";location.href=`mailto:${CONFIG.email}?subject=${encodeURIComponent("Enquiry: "+f.service.value)}&body=${encodeURIComponent(b)}`}
  else o.textContent="Details checked. Online enquiries are not connected yet, so this message has not been sent.";f.reset()})}


let heroTok=0,heroMove=null;
function initHero(){
 const tok=++heroTok,hero=$("#hero"),win=$("#win");
 if(heroMove){removeEventListener("pointermove",heroMove);heroMove=null}
 if(!hero||!win)return;
 const alive=()=>tok===heroTok&&document.body.contains(hero);
 const sleep=ms=>new Promise(r=>setTimeout(()=>{if(alive())r()},ms));
 const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
 const code=$("#code"),st=$("#st"),stt=$("#stt"),ghost=$("#ghost"),chips=[...document.querySelectorAll("[data-d]")];
 const L=[
  [["c","# find the error point"]],
  [["k","def "],["f","build_future"],["","(skills):"]],
  [["","    return "],["t","skils"],["",".practice()"]],
  [["f","build_future"],["","(["],["s",'"learn"'],["",", "],["s",'"build"'],["","])"]]
 ];
 const cur=document.createElement("span");cur.className="cur";
 const build=()=>{code.innerHTML=L.map((_,i)=>`<div class="ln"><b>${i+1}</b><span class="tx"></span></div>`).join("");st.className="status";stt.textContent="Typing…"};
 async function run(){
  while(alive()){
   build();const rows=[...code.children];
   for(let i=0;i<L.length;i++){
    const tx=rows[i].querySelector(".tx");tx.appendChild(cur);
    for(const [cls,txt] of L[i]){
     const sp=document.createElement("span");if(cls)sp.className=cls;tx.insertBefore(sp,cur);
     for(const ch of txt){sp.textContent+=ch;await sleep(RM?0:30)}
    }
    await sleep(RM?0:150);
   }
   const row=rows[2],bad=row.querySelector(".t");
   row.classList.add("bad");const tag=document.createElement("em");tag.className="tag";tag.textContent="Error point";row.appendChild(tag);
   st.className="status bad";stt.textContent="1 error found";
   await sleep(RM?0:1600);
   stt.textContent="Fixing…";
   for(let k=bad.textContent.length;k>0;k--){bad.textContent=bad.textContent.slice(0,k-1);await sleep(RM?0:80)}
   for(const ch of "skills"){bad.textContent+=ch;await sleep(RM?0:110)}
   row.classList.remove("bad");row.classList.add("good");tag.textContent="Resolved";
   st.className="status ok";stt.textContent="All clear · ready to ship";
   if(RM)return;
   await sleep(3000);
  }
 }
 run();
 let tx=0,ty=0,x=0,y=0,last=-9999;
 heroMove=e=>{tx=e.clientX/innerWidth*2-1;ty=e.clientY/innerHeight*2-1;last=performance.now();
  hero.style.setProperty("--mx",e.clientX+"px");hero.style.setProperty("--my",(e.clientY-hero.getBoundingClientRect().top)+"px")};
 addEventListener("pointermove",heroMove,{passive:true});
 (function frame(t){
  if(!alive())return;
  const idle=performance.now()-last>2500;
  const gx=idle?Math.sin(t/1800)*.6:tx,gy=idle?Math.cos(t/2300)*.4:ty;
  x+=(gx-x)*.07;y+=(gy-y)*.07;
  if(!RM){
   win.style.transform=`rotateY(${x*12}deg) rotateX(${-y*9}deg)`;
   chips.forEach(c=>{const d=+c.dataset.d;c.style.transform=`translate3d(${x*d}px,${y*d}px,0)`});
   if(ghost)ghost.style.transform=`translate(${-x*26}px,calc(-50% + ${-y*16}px))`;
  }
  requestAnimationFrame(frame);
 })(0);
}
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".card");if(c){const r=c.getBoundingClientRect();c.style.setProperty("--cx",e.clientX-r.left+"px");c.style.setProperty("--cy",e.clientY-r.top+"px")}},{passive:true});

const PAGES={home:pageHome,about:pageAbout,services:pageServices,courses:pageCourses,contact:pageContact};
function route(){const [,p="home",sub=""]=location.hash.split("/");const k=PAGES[p]?p:"home";const arg=decodeURIComponent(sub);
 $("#app").innerHTML=PAGES[k]();document.querySelectorAll("#links a[data-p]").forEach(a=>a.classList.toggle("on",a.dataset.p===k));
 $("#nav").classList.remove("open");$("#mb").innerHTML=ic("menu");$("#mb").setAttribute("aria-expanded","false");
 document.title=k==="home"?"ERROR POINT Technologies | Learn, Build & Innovate":NAV.find(n=>n[0]===k)[1]+" | ERROR POINT Technologies";
 initForm(k==="contact"?arg:"");reveal();initHero();
 if(k==="contact"&&arg){setTimeout(()=>$("#f").scrollIntoView({block:"center"}),50)}
 else if(arg&&$("#"+arg)){setTimeout(()=>$("#"+arg).scrollIntoView(),50)}else scrollTo(0,0)}
function reveal(){const els=document.querySelectorAll(".rv");if(!("IntersectionObserver"in window)){els.forEach(e=>e.classList.add("v"));return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("v");io.unobserve(e.target)}}),{threshold:.12});els.forEach(e=>io.observe(e))}
